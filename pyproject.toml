[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "carrot-rl"
version = "0.1.0"
description = "A lightweight, backend-neutral runtime for distributed robot learning."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "ray>=2.47",
]

[project.optional-dependencies]
sft = [
  "lerobot[dataset,smolvla]==0.6.1",
  "pyyaml>=6",
  "torch>=2.6",
  "wandb>=0.16",
]
dev = [
  "pytest>=8",
  "ruff>=0.9",
]

[project.scripts]
carrot-train-sft = "carrot.cli.train_sft:main"

[tool.hatch.build.targets.wheel]
packages = ["src/carrot"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
