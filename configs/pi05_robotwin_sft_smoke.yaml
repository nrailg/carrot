model:
  path: /mnt/ceph-hz1-csp/mm-base-plt2/nrwu/pi05-parity-temp/pi05-openpi-pytorch-checkpoint
  tokenizer_path: /mnt/ceph-hz1-csp/mm-base-plt2/nrwu/hf-hub/google/paligemma-3b-pt-224
dataset:
  factory: carrot.data.lerobot.build_dataset
  factory_kwargs:
    repo_id: lerobot/robotwin_unified
    root: /mnt/ceph-hz1-csp/mm-base-plt2/nrwu/hf-hub/lerobot/robotwin_unified
    action_horizon: 50
    image_keys:
      - observation.images.cam_high
      - observation.images.cam_left_wrist
      - observation.images.cam_right_wrist
  num_workers: 0
  norm_stats_path: null
  preprocess: carrot.data.lerobot.robotwin_preprocess
optimizer:
  learning_rate: 2.5e-5
  weight_decay: 1.0e-10
  betas: [0.9, 0.95]
  eps: 1.0e-8
  warmup_steps: 0
  decay_steps: 1
  decay_learning_rate: 2.5e-6
  max_grad_norm: 1.0
fsdp:
  enabled: true
  param_dtype: bfloat16
  reduce_dtype: float32
  reshard_after_forward: true
steps: 1
micro_batch_size: 1
global_batch_size: 1
log_freq: 1
save_freq: 1
output_dir: /mnt/ceph-hz1-csp/mm-base-plt2/nrwu/work/carrot/outputs/pi05_robotwin_smoke
dp_size: 1
num_nodes: 1
