[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "carrot-rl"
version = "0.1.0"
description = "A lightweight, backend-neutral runtime for distributed robot learning."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "ray>=2.47",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/carrot"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
