model:
  path: /mnt/ceph-hz1-csp/mm-base-plt2/nrwu/hf-hub/Miical/pi05-base
  tokenizer_path: /mnt/ceph-hz1-csp/mm-base-plt2/nrwu/hf-hub/Miical/pi05-base
dataset:
  repo_id: lerobot/robotwin_unified
  root: /mnt/ceph-hz1-csp/mm-base-plt2/nrwu/hf-hub/lerobot/robotwin_unified
  num_workers: 4
  norm_stats_path: /mnt/ceph-hz1-csp/mm-base-plt2/nrwu/hf-hub/lerobot/robotwin_unified/meta/pi05_norm_stats.json
  adapt_aloha: true
  delta_actions: true
  image_keys:
    - observation.images.cam_high
    - observation.images.cam_left_wrist
    - observation.images.cam_right_wrist
optimizer:
  learning_rate: 2.5e-5
  weight_decay: 1.0e-10
  betas: [0.9, 0.95]
  eps: 1.0e-8
  warmup_steps: 1000
  decay_steps: 30000
  decay_learning_rate: 2.5e-6
  max_grad_norm: 1.0
fsdp:
  enabled: true
  param_dtype: bfloat16
  reduce_dtype: float32
  reshard_after_forward: true
steps: 30000
micro_batch_size: 4
global_batch_size: 32
output_dir: outputs/pi05_robotwin_sft
dp_size: 8
num_nodes: 1
