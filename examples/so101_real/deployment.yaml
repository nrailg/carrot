observation_source: dataset
action_sink: log
server_uri: ws://127.0.0.1:8000
output_dir: outputs/so101_debug
dataset_root: null
dataset_repo: ''
base_camera: top
wrist_camera: fpv
episode: 0
start_frame: 0
prompt: null
execute_steps: 1
max_chunks: 1  # null runs to the episode boundary (robot mode runs until interrupted)
fps: 30
connect_timeout_s: 10.0
warmup_timeout_s: 60.0
request_timeout_s: 5.0
robot_port: null
robot_id: null
calibration_dir: null
use_degrees: true
max_relative_target: 5.0
initial_state_tolerance: 10.0
wait_for_target: false  # single-step robot mode can wait for measured arrival
target_tolerance: 1.0  # five axes in degrees; gripper in its original units
target_timeout_s: 3.0
cameras: {}  # robot source requires the selected camera names
