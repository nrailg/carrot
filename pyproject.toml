[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "carrot-rl"
version = "0.1.0"
description = "A lightweight, backend-neutral runtime for distributed robot learning."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
dependencies = [
  "ray>=2.47",
]

[project.optional-dependencies]
sft = [
  "datasets>=4",
  "diffusers==0.35.1",
  "huggingface-hub==1.31.0",
  "lerobot[dataset]==0.6.1",
  "numpy==2.3.1",
  "pyyaml>=6",
  "rerun-sdk==0.31.4",
  "safetensors>=0.4",
  "torch==2.11.0",
  "torchaudio==2.11.0",
  "torchvision==0.26.0",
  "transformers==5.5.4",
  "wandb>=0.16",
]
isaac-arena = [
  "isaaclab[isaacsim,all]==3.0.0b2.post1",
  "isaaclab-arena @ git+https://github.com/isaac-sim/IsaacLab-Arena.git@release/0.3.0",
  "isaacsim[all,extscache]==6.0.1.0",
  "torch==2.11.0",
  "torchaudio==2.11.0",
  "torchvision==0.26.0",
]
dev = [
  "pytest>=8",
  "pytest-timeout>=2.3",
  "ruff>=0.9",
]

[dependency-groups]
openpi-libero = [
  "imageio[ffmpeg]>=2.36.1",
  "lerobot @ git+https://github.com/huggingface/lerobot.git@0cf864870cf29f4738d3ade893e6fd13fbd7cdb5",
  "libero @ git+https://github.com/Lifelong-Robot-Learning/LIBERO.git@f78abd68ee283de9f9be3c8f7e2a9ad60246e95c",
  "matplotlib>=3.9,<4",
  "mujoco==3.2.3",
  "openpi @ git+https://github.com/Physical-Intelligence/openpi.git@215abfb217dbac7d5f1273282331b9b1866c0479",
  "openpi-client @ git+https://github.com/Physical-Intelligence/openpi.git@215abfb217dbac7d5f1273282331b9b1866c0479#subdirectory=packages/openpi-client",
  "robosuite==1.4.1",
]

[project.scripts]
carrot-train-sft = "carrot.cli.train_sft:main"
carrot-compute-pi05-stats = "carrot.cli.compute_pi05_stats:main"

[tool.hatch.build.targets.wheel]
packages = ["src/carrot"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/carrot/models/pi05/model/**/*.py" = ["E501", "E741", "F841", "I", "SIM", "UP"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
index-strategy = "first-index"
prerelease = "if-necessary"
conflicts = [
  [
    { group = "openpi-libero" },
    { extra = "sft" },
  ],
  [
    { group = "openpi-libero" },
    { extra = "isaac-arena" },
  ],
]
override-dependencies = [
  "boto3==1.40.61",
  "botocore==1.40.61",
  "click==8.1.7",
  "coverage==7.4.4",
  "packaging==26.0",
  "requests==2.32.3",
  "s3transfer==0.14.0",
  "websockets==16.1.1",
  { package = { name = "isaaclab", version = "3.0.0b2.post1" }, dependencies = [
    "transformers==5.5.4",
  ] },
  { package = { name = "lerobot", version = "0.6.1" }, dependencies = [
    "numpy==2.3.1",
  ] },
]
constraint-dependencies = [
  "lightwheel-sdk==1.0.3",
  "mujoco-usd-converter==0.2.0",
  "numba==0.64.0",
  "onnx==1.21.0",
  "onnxruntime==1.30.0",
  "openai==2.28.0",
  "pin-pink==3.3.0",
  "pyglet<3",
  "sbi==0.27.0",
  "tinyobjloader==2.0.0rc13",
  "vuer==0.1.6",
]

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
isaacteleop = { index = "pypi" }
mujoco-usd-converter = { index = "pypi" }
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
