  eps: 1.0e-8
  warmup_steps: 0
  decay_steps: 30000
  decay_learning_rate: 1.0e-5
  max_grad_norm: 1.0
fsdp:
  enabled: true
  param_dtype: bfloat16
  reduce_dtype: float32
  reshard_after_forward: true
wandb:
  enabled: true
  project: carrot-sft
  entity: "1001"
  name: pi05_robotwin_sft_20260913_gbs512_lr1e-5
steps: 30000
micro_batch_size: 4
global_batch_size: 512
output_dir: outputs/pi05_robotwin_sft_20260913
save_freq: 2000
dp_size: 16
num_nodes: 2
